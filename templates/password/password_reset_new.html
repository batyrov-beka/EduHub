{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Новый пароль" %}{% endblock %}

{% block content %}
<div class="page">
    <div class="container">
        <div class="panel center-card">
            <div class="big-icon"><i class="bi bi-lock"></i></div>
            <h1 style="font-size: 1.6rem;">{% trans "Придумайте новый пароль" %}</h1>
            <p class="muted">{% trans "Не менее 8 символов." %}</p>
            <form method="post" class="stack" style="margin-top: 20px; text-align: left;">
                {% csrf_token %}
                <div class="field">
                    <label for="password1">{% trans "Новый пароль" %}</label>
                    <div class="input-icon"><i class="bi bi-lock"></i>
                        <input type="password" name="password1" id="password1" minlength="8" required autocomplete="new-password">
                        <button type="button" class="password-toggle" data-toggle-password="password1"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="field">
                    <label for="password2">{% trans "Повторите пароль" %}</label>
                    <div class="input-icon"><i class="bi bi-lock"></i>
                        <input type="password" name="password2" id="password2" minlength="8" required autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">{% trans "Сохранить пароль" %}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
