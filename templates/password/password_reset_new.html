{% extends 'base.html' %}

{% block content %}
<style>

:root {
    --primary-color: #0073b1;
    --primary-hover: #005582;
    --bg-color: #0f1419;
    --card-bg: rgba(131, 168, 211, 0.12);
    --text-main: white;
    --text-muted: #a0aec0;
    --border-color: rgba(255, 255, 255, 0.12);
    --input-focus: #3b82f6;
}

 .auth-card input:-webkit-autofill,
.auth-card input:-webkit-autofill:hover,
.auth-card input:-webkit-autofill:focus,
.auth-card textarea:-webkit-autofill,
.auth-card select:-webkit-autofill {
    -webkit-box-shadow: 0 0 0px 1000px rgba(30, 50, 80, 0.6) inset;
    -webkit-text-fill-color: #e0e7ff;
    transition: background-color 5000s ease-in-out 0s;
}

body {
    background-color: var(--bg-color);
    font-family: 'Inter', sans-serif;


    background: linear-gradient(
        -45deg,
        #0f1419,
        #1a3a52,
        #0f1419,
        #1a2b4a
    );
    background-size: 400% 400%;
    animation: gradient 8s ease infinite;
    min-height: 100vh;
    color: white;
}

@keyframes gradient {
    0% {
        background-position: 0% 25%;
    }
    25% {
        background-position: 25% 50%;
    }
    50% {
        background-position: 50% 75%;
    }
    75% {
        background-position: 75% 100%;
    }
    100% {
        background-position: 0% 50%;
    }
}

.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
}

.icon-header {
    width: 60px;
    height: 60px;
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 20px;
    border: 2px solid rgba(59, 130, 246, 0.3);
}

.auth-card h2 {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    color: var(--text-main);
    margin-bottom: 8px;
}

.auth-card p.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 32px;
    line-height: 1.5;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 8px;
}

.password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.custom-input {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    background-color: rgba(30, 50, 80, 0.6);
    color: #e0e7ff;
    transition: all 0.2s ease;
    outline: none;
    box-sizing: border-box;
}

.custom-input::placeholder {
    color: rgba(224, 231, 255, 0.6);
}

.custom-input:focus {
    border-color: var(--input-focus);
    background-color: rgba(30, 50, 80, 0.8);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    color: #ffffff;
}

.eye-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    z-index: 5;
    transition: color 0.2s;
}

.eye-toggle:hover {
    color: var(--text-main);
}

.eye-toggle svg {
    width: 20px;
    height: 20px;
}

.btn-save {
    width: 100%;
    padding: 14px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
}

.btn-save:hover {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0, 115, 177, 0.3);
}

.btn-save:active {
    transform: translateY(0);
}


@media (max-width: 480px) {
    .auth-card {
        padding: 30px 20px;
        border-radius: 0;
        border: none;
        box-shadow: none;
        background: rgba(131, 168, 211, 0.08);
    }
    .auth-container {
        padding: 0;
    }
}
</style>

{% load i18n %}
<div class="auth-container">
    <div class="auth-card">
        <div class="icon-header">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="30" height="30">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
        </div>

        <h2>{% trans "Новый пароль" %} 🔑</h2>
        <p class="subtitle">{% trans "Установите новый надежный пароль для защиты вашего аккаунта." %}</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>{% trans "Новый пароль" %}</label>
                <div class="password-wrapper">
                    <input type="password" name="password1" id="id_password1" class="custom-input" placeholder="{% trans 'Минимум 8 символов' %}" required>
                    <button type="button" class="eye-toggle" onclick="togglePass('id_password1', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>{% trans "Подтвердите пароль" %}</label>
                <div class="password-wrapper">
                    <input type="password" name="password2" id="id_password2" class="custom-input" placeholder="{% trans 'Повторите ввод' %}" required>
                    <button type="button" class="eye-toggle" onclick="togglePass('id_password2', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-save">{% trans "Обновить пароль" %}</button>
        </form>
    </div>
</div>

<script>
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('svg');

        const eyePath = '<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />';
        const eyeSlashPath = '<path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';

        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = eyeSlashPath;
        } else {
            input.type = 'password';
            icon.innerHTML = eyePath;
        }
    }
</script>
{% endblock %}
