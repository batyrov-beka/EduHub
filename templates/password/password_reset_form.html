{% extends 'base.html' %}

{% block content %}
<style>

:root {
    --primary-color: #0073b1;
    --primary-hover: #005582;
    --bg-color: #0f1419;
    --card-bg: rgba(131, 168, 211, 0.12);
    --text-main: white;
    --text-muted: #a0aec0;
    --border-color: rgba(255, 255, 255, 0.12);
    --input-focus: #3b82f6;
}

.auth-card input:-webkit-autofill,
.auth-card input:-webkit-autofill:hover,
.auth-card input:-webkit-autofill:focus,
.auth-card textarea:-webkit-autofill,
.auth-card select:-webkit-autofill {
    -webkit-box-shadow: 0 0 0px 1000px rgba(30, 50, 80, 0.6) inset;
    -webkit-text-fill-color: #e0e7ff;
    transition: background-color 5000s ease-in-out 0s;
}


body {
    background-color: var(--bg-color);
    font-family: 'Inter', sans-serif;


    background: linear-gradient(
        -45deg,
        #0f1419,
        #1a3a52,
        #0f1419,
        #1a2b4a
    );
    background-size: 400% 400%;
    animation: gradient 8s ease infinite;
    min-height: 100vh;
    color: white;
}

@keyframes gradient {
    0% {
        background-position: 0% 25%;
    }
    25% {
        background-position: 25% 50%;
    }
    50% {
        background-position: 50% 75%;
    }
    75% {
        background-position: 75% 100%;
    }
    100% {
        background-position: 0% 50%;
    }
}

.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
    text-align: center;
}


.icon-box {
    width: 60px;
    height: 60px;
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 20px;
    border: 2px solid rgba(59, 130, 246, 0.3);
}

.auth-card h2 {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 12px;
}

.auth-card p.subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 30px;
    line-height: 1.5;
}

.form-group {
    text-align: left;
    margin-bottom: 24px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 8px;
}

.custom-input {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    background-color: rgba(30, 50, 80, 0.6);
    color: #e0e7ff;
    transition: all 0.2s ease;
    outline: none;
    box-sizing: border-box;
}

.custom-input::placeholder {
    color: rgba(224, 231, 255, 0.6);
}

.custom-input:focus {
    border-color: var(--input-focus);
    background-color: rgba(30, 50, 80, 0.8);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    color: #ffffff;
}

.btn-reset {
    width: 100%;
    padding: 14px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-reset:hover {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0, 115, 177, 0.2);
}

.btn-reset:active {
    transform: translateY(0);
}

.back-to-login {
    display: inline-block;
    margin-top: 25px;
    font-size: 14px;
    color: #60a5fa;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
}

.back-to-login:hover {
    color: #93c5fd;
    text-decoration: none;
}

@media (max-width: 480px) {
    .auth-card {
        padding: 30px 20px;
        border-radius: 0;
        border: none;
        box-shadow: none;
        background: rgba(131, 168, 211, 0.08);
    }
}
</style>

{% load i18n %}

<div class="auth-container">
    <div class="auth-card">
        <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h2>{% trans "Восстановление доступа" %}</h2>
        <p class="subtitle">{% trans "Введите ваш Email, и мы отправим вам 6-значный код для сброса пароля." %}</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>{% trans "Электронная почта" %}</label>
                <input type="email" name="email" class="custom-input" placeholder="example@mail.com" required>
            </div>

            <button type="submit" class="btn-reset">
                {% trans "Отправить код доступа" %}
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-to-login">
            {% trans "← Вернуться к входу" %}
        </a>
    </div>
</div>
{% endblock %}
