
<div class="field {% if field.errors %}has-error{% endif %} {{ cls }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
</div>
