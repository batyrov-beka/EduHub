{% extends 'base.html' %}

{% block content %}

    <style>

    :root {

    --primary-color: #0073b1;

    --primary-hover: #005582;

    --bg-color: #0f1419;

    --card-bg: rgba(131, 168, 211, 0.08);

    --text-main: #ffffff;

    --text-muted: #a0aec0;

    --border-color: rgba(255, 255, 255, 0.12);

    --accent-color: #3b82f6;

    }



    body {

    background-color: var(--bg-color);

    font-family: 'Inter', system-ui, -apple-system, sans-serif;

    color: var(--text-main);

    background: linear-gradient(-45deg, #0f1419, #1a3a52, #0f1419, #1a2b4a);

    background-size: 400% 400%;

    animation: gradient 8s ease infinite;

    min-height: 100vh;

    margin: 0;

    }



    @keyframes gradient {

    0% { background-position: 0% 25%; }

    50% { background-position: 100% 50%; }

    100% { background-position: 0% 25%; }

    }




.search-container {
    max-width: 1200px;
    margin: 0 auto 40px auto;
    padding: 0 20px;
}

.search-section {
    background: rgba(30, 41, 59, 0.4);
    backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
}


.search-row {
    display: flex;
    gap: 12px;
    width: 100%;
}

.search-input {
    flex: 1;
    background: rgba(15, 23, 42, 0.7) !important;
    border: 1px solid rgba(56, 189, 248, 0.3) !important;
    border-radius: 14px !important;
    color: white !important;
    padding: 14px 20px !important;
    font-size: 16px;
    width: 100%;
    outline: none;
}

.search-input:focus {
    border-color: var(--accent-color) !important;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2) !important;
}

.btn-search {
    background: var(--accent-color);
    color: white;
    font-weight: 700;
    border-radius: 14px;
    padding: 14px 35px;
    border: none;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    cursor: pointer;
}

.btn-search:hover {
    background: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
}


@media (max-width: 768px) {
    .search-row {
        flex-direction: column;
    }
    .btn-search {
        width: 100%;
    }
}



    .page-header {

    margin: 40px 0;

    text-align: center;

    }



    .page-header h2 {

    font-weight: 800;

    font-size: 42px;

    color: var(--text-main);

    letter-spacing: -1px;

    }



    .page-header p {

    color: var(--text-muted);

    font-size: 18px;

    }



    .jobs-grid {

    display: grid;

    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));

    gap: 25px;

    padding: 20px;

    max-width: 1200px;

    margin: 0 auto;

    }



    .job-card {

    background: var(--card-bg);

    backdrop-filter: blur(15px);

    border: 1px solid var(--border-color);

    border-radius: 24px;

    padding: 30px;

    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    }



    .job-card:hover {

    transform: translateY(-10px);

    background: rgba(131, 168, 211, 0.15);

    border-color: var(--accent-color);

    }



    .company-wrapper {

    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;

    }



    .company-logo-plug {

    width: 50px;

    height: 50px;

    background: rgba(30, 50, 80, 0.8);

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: var(--accent-color);

    font-weight: bold;

    }



    .job-title {

    font-size: 24px;

    font-weight: 800;

    color: var(--text-main);

    margin-bottom: 8px;

    }



    .big_phone {

    font-size: 14px;

    color: #94a3b8;

    margin-bottom: 12px;

    display: flex;

    align-items: center;

    gap: 8px;

    }



    .meta-tags {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    }



    .tag {

    padding: 6px 14px;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 700;

    background: rgba(255, 255, 255, 0.05);

    color: var(--text-muted);

    }



    .tag-salary {
    background: rgba(16, 185, 129, 0.1);
    color: #10b981;

    }



    .job-desc {

    font-size: 15px;

    color: var(--text-muted);

    line-height: 1.6;

    margin-bottom: 25px;

    }



    .job-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-top: 20px;

    border-top: 1px solid var(--border-color);

    }



    @media (max-width: 768px) {
        .page-header h2 { font-size: 28px; }
        .page-header p { font-size: 15px; }

        .search-row {
            flex-direction: column;
        }

        .btn-search {
            width: 100%;
            padding: 12px;
        }

        .jobs-grid {
            grid-template-columns: 1fr;
            padding: 15px;
        }
    }

    </style>



<div class="container">
    <div class="page-header">
        <h2>Актуальные предложения</h2>
        <p>Найдите работу или стажировку, которая изменит вашу жизнь</p>
    </div>

    <div class="search-container">
    <div class="search-section">
        <form method="GET" action="{% url 'vacancy_list' %}" class="search-row">
            <input type="text" name="search" class="search-input"
                   placeholder="Поиск вакансий..."
                   value="{{ request.GET.search|default:'' }}" autocomplete="off">
            <button type="submit" class="btn-search">Найти</button>
        </form>
    </div>
</div>

    <div class="jobs-grid">
        {% include 'jobs/job_list_partial.html' %}
    </div>
</div>

<script>
    const searchInput = document.querySelector('.search-input');
    const jobContainer = document.querySelector('.jobs-grid');
    const searchForm = document.querySelector('form');

    function performSearch() {
        const query = searchInput.value;
        const url = "{% url 'vacancy_list' %}?search=" + encodeURIComponent(query);

        fetch(url, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(response => response.text())
        .then(data => {
            jobContainer.innerHTML = data;
        })
        .catch(err => console.error("Ката:", err));
    }

    searchInput.addEventListener('input', performSearch);
    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        performSearch();
    });
</script>


{% endblock %}
